org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Meta Wearables Device Access Toolkit credentials.
# 0/0 is the Developer Mode placeholder and is what you want for local development.
# For a release build, use the APPLICATION_ID / CLIENT_TOKEN issued in the
# Wearables Developer Center -- override these in ~/.gradle/gradle.properties or
# with -PMWDAT_APPLICATION_ID=... rather than committing real values here.
MWDAT_APPLICATION_ID=0
MWDAT_CLIENT_TOKEN=0
