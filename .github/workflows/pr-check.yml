name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :core:test --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  probe-token:
    name: Check for DAT package access
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        env:
          TOKEN: ${{ secrets.MWDAT_PACKAGES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    name: Android app
    needs: probe-token
    # Secrets are not exposed to pull requests from forks, so this is skipped there by design
    # rather than failing a contributor's PR for something they cannot fix.
    if: needs.probe-token.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble and lint
        env:
          GITHUB_TOKEN: ${{ secrets.MWDAT_PACKAGES_TOKEN }}
        run: ./gradlew :app:assembleDebug :app:lintDebug --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
